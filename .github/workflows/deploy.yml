name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          # Matches local dev (.nvmrc). npm 10 (Node 20) rejects lockfiles
          # written by npm 11, which is what broke deploys before.
          node-version: 24
          cache: npm

      - name: Install dependencies
        # npm install, not npm ci: the wasm-fallback packages (@emnapi /
        # @tailwindcss/oxide-wasm32-wasi bundled deps) trip a long-standing
        # arborist bug where npm ci rejects lockfiles npm itself generated.
        # install resolves from the same lockfile and heals instead of
        # refusing - fine for a static marketing site.
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build
        env:
          # Cookieless anonymous analytics (PostHog EU, "Hubbly Website"
          # project). phc_ project keys are public by design - they end up
          # in the page source either way. Only production builds get them;
          # local/dev builds collect nothing.
          PUBLIC_POSTHOG_KEY: phc_CpF3cyjPydZ7m3aFsvhsnTh8FdTaTJPnowHkiQdsuFAJ
          PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    <!-- From: Hubbly <hello@gethubbly.app> -->

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fff8ee;margin:0;padding:0;">
      <tr>
        <td align="center" style="padding:32px 16px;">

            </tr>
            <tr>
              <td style="font-family:Arial, Helvetica, sans-serif;font-size:16px;line-height:1.5;color:#2d3142;padding:0 0 24px;">Tap to confirm. If you didn't sign up, ignore this and we'll delete your address within 21 days.</td>
            </tr>
            <tr>
              <td>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#b93c37" style="background-color:#b93c37;border-radius:12px;">

                      </v:roundrect>

                      <a href="{$url}" style="background-color:#b93c37;border-radius:12px;color:#ffffff;display:block;font-family:Arial, Helvetica, sans-serif;font-size:16px;font-weight:bold;line-height:48px;min-height:48px;text-align:center;text-decoration:none;width:100%;mso-hide:all;">Confirm your email</a>
                    </td>

                </table>
              </td>
            </tr>
            <tr>
              <td style="font-family:Arial, Helvetica, sans-serif;font-size:13px;line-height:1.5;color:#4a4f66;padding:40px 0 0;">
                PerfectDay Technologies Ltd, registered in England and Wales, company no. 16952922, 71-75 Shelton Street, Covent Garden, London, WC2H 9JQ, United Kingdom.
                <br /><br />
                <a href="{$unsubscribe}" style="color:#4a4f66;text-decoration:underline;">Unsubscribe</a>
